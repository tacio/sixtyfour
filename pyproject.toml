[project]
name = "sixty-four"
version = "1.0.0"
description = "A font that renders base64 as 64 human-distinguishable symbols, encoded by both colour and hatch."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fonttools[woff,ufo]>=4.60",
    "skia-pathops>=0.9",
    "ufo2ft>=3.6",
    "ufoLib2>=0.18",
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sixty-four-build = "sixtyfour.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sixtyfour"]
